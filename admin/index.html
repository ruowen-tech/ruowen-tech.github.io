<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>内容管理 · 上海若紊科技</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg" />
</head>
<body>
  <!-- Decap CMS（锁定大版本，避免 ^ 导致全局 API 漂移）。
       加载后异步读取同目录下的 config.yml 自动初始化。
       自定义控件 autoDate 与预览模板由 preview.js 同步注册，
       早于 Decap 异步 init，故无需 Manual Init（手动 fetch config 会触发
       "collections names must be unique" 之类校验问题）。 -->
  <script src="https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js"></script>
  <!-- 后台美化样式（置于脚本之后，确保覆盖 Decap 默认样式）。?v 用于破除 CDN/浏览器缓存 -->
  <link rel="stylesheet" href="cms.css?v=3" />
  <!-- 实时预览模板 + autoDate 控件（须在 decap-cms.js 之后加载）。?v 破除缓存 -->
  <script src="preview.js?v=4"></script>
</body>
</html>
