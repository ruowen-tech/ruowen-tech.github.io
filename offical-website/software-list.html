<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">软件下载</title>
  <meta name="description" content="上海若紊科技软件下载中心，汇集常用开源与免费工具，支持 Windows / macOS / Linux 多平台，一键下载与查看文档。">
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    /* 本页补充样式：仅作用于软件下载页，复用主页设计令牌 */
    .soft-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; margin-top: 36px; }
    .soft-search { position: relative; flex: 1; max-width: 460px; }
    .soft-search input { width: 100%; padding: 13px 16px 13px 46px; border: 1px solid var(--slate-200);
      border-radius: 999px; background: var(--bg-soft); font-size: 15px; transition: .2s var(--ease); }
    .soft-search input:focus { outline: none; border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px rgba(47,107,255,.12); }
    .soft-search svg { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--slate-400); }
    .lang-select { padding: 12px 18px; border: 1px solid var(--slate-200); border-radius: 999px;
      background: #fff; color: var(--slate-700); font-weight: 600; font-size: 14px; cursor: pointer; transition: .2s var(--ease); }
    .lang-select:focus { outline: none; border-color: var(--accent); }
    .soft-updated { font-size: 13px; color: var(--slate-400); }

    .soft-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 40px; }
    .soft-card { display: flex; flex-direction: column; }
    .soft-card__head { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
    .soft-card__logo { width: 60px; height: 60px; flex: none; border-radius: 14px; background: var(--bg-mist);
      display: grid; place-items: center; overflow: hidden; border: 1px solid var(--slate-200); }
    .soft-card__logo img { width: 100%; height: 100%; object-fit: contain; }
    .soft-card__name { font-size: 19px; font-weight: 800; color: var(--ink); }
    .soft-card__ver { font-size: 13px; color: var(--slate-500); margin-top: 2px; }
    .soft-card p.desc { color: var(--slate-500); font-size: 14.5px; flex: 1; margin-bottom: 16px; }
    .soft-card__plat { display: flex; gap: 8px; margin-bottom: 18px; }
    .soft-card__plat img { width: 22px; height: 22px; opacity: .8; }
    .soft-card__foot { display: flex; gap: 10px; }
    .soft-card__foot .btn { flex: 1; height: 44px; padding: 0 14px; font-size: 14px; }
    .soft-empty { padding: 60px 0; text-align: center; color: var(--slate-500); display: none; }
    .soft-empty.show { display: block; }
    .footer__col a.current { color: #fff; font-weight: 700; }

    @media (max-width: 980px) { .soft-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 720px) {
      .soft-grid { grid-template-columns: 1fr; }
      .soft-toolbar { flex-direction: column; align-items: stretch; }
      .soft-search { max-width: none; }
    }
  </style>
</head>
<body>

    <div class="nav__inner">
      <a class="brand" href="../index.html">
        <span class="brand__mark">
          <svg viewBox="0 0 64 64" fill="none">
            <path d="M20 44V20h11a9 9 0 0 1 0 18H20" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="44" cy="44" r="5" fill="#fff"/>
          </svg>
        </span>
        <span class="brand__name">若紊科技<small>RUOWEN TECH</small></span>
      </a>
      <nav class="nav__links">
        <a href="../index.html">首页</a>
        <a href="../about.html">关于我们</a>
        <a href="../products.html">产品服务</a>
        <a href="../news.html">新闻动态</a>

        <a href="../contact.html">联系我们</a>
        <span class="nav__cta"><a class="btn btn--primary btn--sm" href="../contact.html">合作咨询</a></span>
      </nav>
      <button class="nav__toggle" aria-label="菜单"><span></span><span></span><span></span></button>
    </div>
  </header>

  <!-- ===== Page hero (复用主页内页深墨页头) ===== -->
  <section class="page-hero">
    <div class="container">
      <span class="eyebrow">软件资源 · RESOURCES</span>
      <h1>软件下载</h1>
      <p class="page-hero__sub" id="subtitle"></p>
      <p class="lead" id="description"></p>
    </div>
  </section>

  <!-- ===== Software list ===== -->
  <section class="section">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow">全部软件</span>
        <h2 class="section-title" id="software-list-title">软件列表</h2>
        <p class="section-lead" id="info"></p>
      </div>

      <div class="soft-toolbar reveal">
        <div class="soft-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7" stroke-linecap="round"/><path d="m20 20-3.2-3.2" stroke-linecap="round"/></svg>
          <input type="text" id="search" placeholder="" onkeyup="filterSoftware()">
        </div>
        <select id="language-selector" class="lang-select">
          <option value="zh">中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
        </select>
        <span class="soft-updated" id="last-updated">更新时间: 2025-03-26</span>
      </div>

      <div class="soft-grid" id="softwareList"><!-- 软件项由 JS 动态生成 --></div>
      <div class="soft-empty" id="softEmpty">未找到匹配的软件</div>
    </div>
  </section>

  <!-- ===== Footer (复用主页结构与风格) ===== -->
  <footer class="footer">
    <div class="container">
      <div class="footer__top">
        <div>
          <a class="brand" href="../index.html">
            <span class="brand__mark"><svg viewBox="0 0 64 64" fill="none"><path d="M20 44V20h11a9 9 0 0 1 0 18H20" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="44" cy="44" r="5" fill="#fff"/></svg></span>
            <span class="brand__name">若紊科技<small>RUOWEN TECH</small></span>
          </a>
          <p class="footer__about">上海若紊科技有限公司 · 专注于智能生活周边设备的研发与创新，让科技自然融入日常。</p>
        </div>
        <div class="footer__col">
          <h5>导航</h5>
          <a href="../index.html">首页</a>
          <a href="../about.html">关于我们</a>
          <a href="../products.html">产品服务</a>
          <a href="../news.html">新闻动态</a>
          <a href="../recruit.html">加入我们</a>
          <a href="../contact.html">联系我们</a>
        </div>
        <div class="footer__col">
          <h5>产品</h5>
          <a href="../products.html">智能家居中枢</a>
          <a href="../products.html">智能穿戴</a>
          <a href="../products.html">环境传感器</a>
          <a href="software-list.html" class="current">软件下载</a>
        </div>
        <div class="footer__col">
          <h5>联系</h5>
          <a href="../contact.html">合作咨询</a>
          <a href="mailto:contact@wonderingwall.com">contact@wonderingwall.com</a>
          <a href="../contact.html">上海市 · 浦东新区</a>
        </div>
      </div>
      <div class="footer__bottom">
        <div>© <span data-year>2026</span> 上海若紊科技有限公司 保留所有权利</div>
        <div class="footer__social">
          <a href="../contact.html" aria-label="微信"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="10" r="6"/><circle cx="16" cy="14" r="5"/></svg></a>
          <a href="../contact.html" aria-label="邮箱"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
          <a href="../contact.html" aria-label="电话"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h3l2 5-2 1a11 11 0 0 0 5 5l1-2 5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z" stroke-linejoin="round"/></svg></a>
        </div>
      </div>
    </div>
  </footer>

  <script src="../assets/js/main.js"></script>
  <script>
    let currentLanguage = 'zh';
    let i18n = { download: '下载', docs: '文档' };

    function loadLanguage(lang) {
      fetch(`data/${lang}.json`)
        .then(r => r.json())
        .then(data => {
          i18n = { download: data.download || '下载', docs: data.docs || '文档' };
          document.getElementById('page-title').innerText = data.title || '软件下载';
          document.getElementById('description').innerText = data.description;
          document.getElementById('subtitle').innerText = data.subtitle;
          document.getElementById('info').innerText = data.info;
          document.getElementById('search').placeholder = data.search_placeholder;
          document.getElementById('software-list-title').innerText = data.title;
        });
    }

    document.getElementById('language-selector').addEventListener('change', function () {
      currentLanguage = this.value;
      loadLanguage(currentLanguage);
    });

    loadLanguage(currentLanguage);

    fetch('data/list.json')
      .then(r => r.json())
      .then(data => {
        const list = document.getElementById('softwareList');
        data.forEach(software => {
          const item = document.createElement('div');
          item.className = 'card soft-card';
          item.innerHTML = `
            <div class="soft-card__head">
              <div class="soft-card__logo"><img src="${software.image}" alt="${software.name}"></div>
              <div>
                <div class="soft-card__name">${software.name}</div>
                <div class="soft-card__ver">当前版本: ${software.version}</div>
              </div>
            </div>
            <p class="desc">${software.description}</p>
            <div class="soft-card__plat">
              ${software.platforms.map(p => `<img src="${p.icon}" alt="${p.name}" title="${p.name}">`).join('')}
            </div>
            <div class="soft-card__foot">
              <a class="btn btn--primary btn--sm" href="${software.downloadLink}" target="_blank" rel="noopener">${i18n.download}</a>
              <a class="btn btn--ghost btn--sm" href="${software.docsLink}" target="_blank" rel="noopener">${i18n.docs}</a>
            </div>`;
          list.appendChild(item);
        });
      })
      .catch(err => console.error('Error loading the software list:', err));

    function filterSoftware() {
      const input = document.getElementById('search');
      const filter = input.value.toLowerCase();
      const items = document.getElementById('softwareList').getElementsByClassName('soft-card');
      let visible = 0;
      for (let i = 0; i < items.length; i++) {
        const title = items[i].getElementsByClassName('soft-card__name')[0];
        if (title) {
          const match = title.textContent.toLowerCase().indexOf(filter) > -1;
          items[i].style.display = match ? '' : 'none';
          if (match) visible++;
        }
      }
      document.getElementById('softEmpty').classList.toggle('show', visible === 0);
    }
  </script>
</body>
</html>
